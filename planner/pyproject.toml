# Standalone environment for planner/curobo_server.py: torch, warp and cuRobo
# without Isaac Lab. Versions follow the root project's lock.

[project]
name = "hiveboard-curobo-planner"
version = "0.1.0"
description = "HTTP cuRobo planner for running HiveBoard heuristics on a real robot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nvidia-curobo[cu13]",
    "torch==2.12.0",
    "warp-lang==1.17.0",
    "numpy>=2",
]

[tool.uv]
package = false

[tool.uv.sources]
nvidia-curobo = { path = "../dependencies/curobo", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
