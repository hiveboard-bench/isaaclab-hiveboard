[project]
name = "isaaclab-hiveboard"
version = "0.1.0"
description = "Isaac Lab simulation environments for multi-robot HiveBoard manipulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Isaac Lab's source-checkout root owns every runtime dependency (torch,
    # newton, warp, ...) and pulls in all its workspace packages; the
    # per-package extras (isaaclab-newton[all], ...) no longer exist.
    # [ovrtx] adds the kitless RTX renderer used for path-traced videos.
    "isaaclab-dev[ovrtx]",
    "hydra-core>=1.3,<1.4",
    "pytorch-kinematics>=0.10.0",
    "setuptools<82.0.0",
    "tqdm",
    "imgui-bundle>=1.92.601",
    "h5py>=3.16.0",
    "nvidia-curobo[cu13]",
    "viser>=0.2.11",
    "moviepy<2",
]

[project.optional-dependencies]
cameras = ["isaacsim[all,extscache]==6.1.0.0"]
curobo = ["nvidia-curobo[cu13]"]
data = [
    "diffusers>=0.36.0",
    "dill>=0.3.5.1",
    "h5py",
    "inquirerpy",
    "tabulate",
    "tensorboard>=2.20.0",
    "zarr<3",
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

# Named indexes referenced by Isaac Lab's own [tool.uv.sources].
[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
nvidia-curobo = { path = "dependencies/curobo", editable = true }
isaaclab-dev = { path = "dependencies/IsaacLab" }
isaaclab = { path = "dependencies/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "dependencies/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-contrib = { path = "dependencies/IsaacLab/source/isaaclab_contrib", editable = true }
isaaclab-experimental = { path = "dependencies/IsaacLab/source/isaaclab_experimental", editable = true }
isaaclab-newton = { path = "dependencies/IsaacLab/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "dependencies/IsaacLab/source/isaaclab_ov", editable = true }
isaaclab-physx = { path = "dependencies/IsaacLab/source/isaaclab_physx", editable = true }
isaaclab-ppisp = { path = "dependencies/IsaacLab/source/isaaclab_ppisp", editable = true }
isaaclab-rl = { path = "dependencies/IsaacLab/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "dependencies/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-tasks-experimental = { path = "dependencies/IsaacLab/source/isaaclab_tasks_experimental", editable = true }
isaaclab-visualizers = { path = "dependencies/IsaacLab/source/isaaclab_visualizers", editable = true }
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
# Overrides only apply at the top-level project, so mirror Isaac Lab's own
# (dependencies/IsaacLab/pyproject.toml): it owns the Newton, MuJoCo and torch
# versions, and the isaacsim wheels pin older ones.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    # isaacsim-asset-isolated and isaacsim-robot-schema 6.1 pin usd-exchange ==2.3.0.
    "usd-exchange==3.0.0",
    # usd-optimize must share usd-exchange's OpenUSD build (26.08); bump the two together.
    "usd-optimize~=1.3.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "packaging>=20,<27",
]
index-strategy = "unsafe-best-match"
prerelease = "allow"
conflicts = [
    [
        { extra = "cameras" },
        { extra = "curobo" },
    ],
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["source/isaaclab_hiveboard"]
include = ["isaaclab_hiveboard*"]

[tool.setuptools.package-data]
isaaclab_hiveboard = [
    "assets/**/*.mtl",
    "assets/**/*.obj",
    "assets/**/*.png",
    "assets/**/*.urdf",
    "assets/**/*.usd",
    "assets/**/*.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py312"

# Exclude directories
extend-exclude = [
    "logs",
    "_isaac_sim",
    ".vscode",
    "_*",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]

ignore = [
    "E402",   # Module level import not at top of file
    "D401",   # First line should be in imperative mood
    "RET504", # Unnecessary variable assignment before return statement
    "RET505", # Unnecessary elif after return statement
    "SIM102", # Use a single if-statement instead of nested if-statements
    "SIM103", # Return the negated condition directly
    "SIM108", # Use ternary operator instead of if-else statement
    "SIM117", # Merge with statements for context managers
    "SIM118", # Use {key} in {dict} instead of {key} in {dict}.keys()
    "UP006",  # Use 'dict' instead of 'Dict' type annotation
    "UP018",  # Unnecessary `float` call (rewrite as a literal)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "omniverse-extensions",
    "isaaclab",
    "isaaclab-contrib",
    "isaaclab-rl",
    "isaaclab-mimic",
    "isaaclab-tasks",
    "isaaclab-assets",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"omniverse-extensions" = [
    "isaacsim",
    "omni",
    "pxr",
    "carb",
    "usdrt",
    "Semantics",
    "curobo",
]
"isaaclab" = ["isaaclab"]
"isaaclab-assets" = ["isaaclab_assets"]
"isaaclab-contrib" = ["isaaclab_contrib"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-mimic" = ["isaaclab_mimic"]
"isaaclab-tasks" = ["isaaclab_tasks"]

[tool.pyright]
include = ["source", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"
